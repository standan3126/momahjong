<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#063426">
    <title>Momahjong</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/v1/kit.css">
    <link rel="stylesheet" href="/shared/v1/settings.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body class="bamboo-bg select-none">
    <!-- The page background on its own layer, so the night glass has something to tint. -->
    <div id="bgLayer" aria-hidden="true"></div>

    <!-- TOP BAR: GameHub's frame puts Home top left and the Settings gear top right; between
         them only the level (with its coins), tiles left and matches available. -->
    <header id="hud" class="hud safe-top w-full shrink-0 z-30">
        <div id="levelInfo" class="level-info">
            <div class="level-line"><strong id="levelName">Level 1</strong><span id="coinsBox" class="coins-box"><span class="hub-coin" role="img" aria-label="coins"></span><strong id="coinsCount">30</strong></span></div>
            <div class="board-line"><span><strong id="tilesLeftCount">0</strong> tiles</span> · <span><strong id="availPairsCount">0</strong> <span id="matchesWord">matches</span></span></div>
        </div>
        <button id="modifierBadge" type="button" onclick="explainSpecial()" class="hidden modifier-badge" aria-label="What is this level?"></button>
    </header>

    <!-- MAIN BOARD STAGE -->
    <main id="boardViewport" class="relative flex-1 min-h-0 w-full overflow-hidden">
        <div id="boardContainer"></div>
        <div id="floatingTextLayer" class="pointer-events-none absolute inset-0 overflow-hidden z-40"></div>
        <div id="announcer" class="pointer-events-none absolute inset-0 z-40 flex items-center justify-center"></div>
        <button id="autoCompleteBtn" onclick="triggerAutoComplete()" class="hidden absolute bottom-3 inset-x-0 mx-auto w-max z-40 bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 text-emerald-950 font-extrabold px-6 py-3 rounded-full shadow-[0_0_30px_rgba(251,191,36,0.85)] border-2 border-white flex items-center gap-2 text-sm animate-bounce whitespace-nowrap">
            ✨ Auto-Complete!
        </button>
    </main>

    <!-- BOTTOM BAR: the three helpers, paid in coins -->
    <footer id="dock" class="safe-bottom w-full shrink-0 pt-1.5 z-30 bg-gradient-to-t from-black/80 via-black/45 to-transparent">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
            <button id="btnHint" type="button" onclick="useHint()" class="dock-tool">
                <span class="dock-icon">💡</span>
                <span class="dock-name">Hint</span>
                <span class="dock-price"><span class="hub-coin" role="img" aria-label="coins"></span> <span id="price-hint"></span></span>
            </button>
            <button id="btnShuffle" type="button" onclick="useShuffle()" class="dock-tool">
                <span class="dock-icon">🌪️</span>
                <span class="dock-name">Shuffle</span>
                <span class="dock-price"><span class="hub-coin" role="img" aria-label="coins"></span> <span id="price-shuffle"></span></span>
            </button>
            <button id="btnUndo" type="button" onclick="useUndo()" class="dock-tool">
                <span class="dock-icon">📜</span>
                <span class="dock-name">Undo</span>
                <span class="dock-price"><span class="hub-coin" role="img" aria-label="coins"></span> <span id="price-undo"></span></span>
            </button>
        </div>
    </footer>

    <!-- Particle / confetti canvas (above modals, below tutorial coach) -->
    <canvas id="fxCanvas" class="pointer-events-none fixed inset-0 w-full h-full z-[58]"></canvas>
    <div id="popLayer" class="pointer-events-none fixed inset-0 z-[57]"></div>

    <!-- ==========================================
         LEVEL COMPLETE
         ========================================== -->
    <div id="completeModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center safe-pad">
        <div class="pop-in w-full max-w-sm bg-gradient-to-b from-emerald-900 via-emerald-950 to-black border-2 border-amber-400 rounded-3xl p-5 text-center shadow-2xl">
            <div class="text-5xl leading-none">⭐</div>
            <h2 class="text-xl font-serif-asian font-extrabold text-amber-300 mt-2">Level <span id="completedLevelNum">1</span> complete</h2>
            <div id="levelGold" class="mt-3 text-base font-extrabold text-amber-200 space-y-1"></div>
            <div class="flex flex-col gap-2 mt-5">
                <button id="nextLevelBtn" type="button" onclick="proceedToNextLevel()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 to-amber-500 text-emerald-950 font-extrabold text-base active:scale-95 transition">Next level</button>
                <button type="button" onclick="afterLevel({ toMap: true })" class="w-full py-3 rounded-2xl bg-emerald-800 border border-amber-400/40 text-amber-200 font-extrabold text-sm active:scale-95 transition">Levels</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         NO MATCHES LEFT: a calm card with the ways forward
         ========================================== -->
    <div id="noMovesModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center safe-pad">
        <div class="pop-in w-full max-w-sm bg-emerald-950 border-2 border-amber-400 rounded-3xl p-5 text-center shadow-2xl">
            <div class="text-4xl mb-2">🏮</div>
            <h3 class="text-xl font-serif-asian font-extrabold text-amber-300">No matches left</h3>
            <p id="stuckNote" class="text-sm text-emerald-100/90 mt-2 mb-4 leading-relaxed"></p>
            <div class="flex flex-col gap-2.5">
                <button id="stuckShuffle" type="button" onclick="useShuffle()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-amber-500 text-emerald-950 font-extrabold text-sm shadow-lg active:scale-95 transition disabled:opacity-40"></button>
                <button type="button" onclick="restartLevel()" class="w-full py-3 rounded-2xl bg-emerald-800 border border-amber-400/40 text-amber-200 font-extrabold text-sm active:scale-95 transition">🔄 Restart this board</button>
                <button type="button" onclick="openMap()" class="w-full py-3 rounded-2xl bg-emerald-800 border border-amber-400/40 text-amber-200 font-extrabold text-sm active:scale-95 transition">Levels</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         LITTLE GAMES BETWEEN LEVELS
         ========================================== -->
    <div id="breakModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center safe-pad">
        <div class="pop-in w-full max-w-md max-h-full overflow-y-auto bg-gradient-to-b from-emerald-900 via-emerald-950 to-black border-2 border-amber-400 rounded-3xl p-4 text-center shadow-[0_0_50px_rgba(245,158,11,0.3)]">
            <div class="inline-block px-3 py-1 rounded-full bg-amber-400/20 border border-amber-400/50 text-amber-300 text-xs font-extrabold tracking-widest uppercase">A little game</div>
            <h2 id="breakTitle" class="text-xl font-serif-asian font-extrabold text-amber-300 mt-2"></h2>
            <p id="breakHelp" class="text-xs text-emerald-200 mt-1 mb-3"></p>
            <div id="breakArea"></div>
            <div id="breakStatus" role="status" class="text-sm font-extrabold text-amber-200 mt-3 min-h-[1.25rem]"></div>
            <div class="flex gap-3 mt-3">
                <button id="breakSkip" onclick="endBreak()" class="flex-1 py-3 rounded-2xl bg-black/40 border border-amber-400/40 text-amber-200 font-extrabold text-sm active:scale-95 transition">Skip</button>
                <button id="breakFinish" onclick="endBreak()" class="hidden flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 text-emerald-950 font-extrabold text-base active:scale-95 transition">Continue ➡️</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         THE BAMBOO PATH (LEVEL MAP)
         ========================================== -->
    <div id="mapScreen" class="hidden fixed inset-0 z-[60] bg-emerald-950 flex flex-col">
        <!-- Levels: Home (top left) and the gear (top right) come from GameHub's frame. -->
        <header class="map-head safe-top shrink-0 pb-2 bg-gradient-to-b from-black/80 to-black/40 border-b border-amber-400/30">
            <div class="font-serif-asian font-extrabold text-amber-300 text-lg leading-tight">Levels</div>
            <div class="text-[11px] font-bold text-emerald-200">The Bamboo Path · tap a finished level to play it again</div>
        </header>
        <div id="mapScroll" class="flex-1 min-h-0 overflow-y-auto overscroll-contain">
            <div id="mapCanvas" class="max-w-xl mx-auto"></div>
        </div>
    </div>

    <!-- ==========================================
         GENERIC MESSAGE / CONFIRM MODAL
         ========================================== -->
    <div id="msgModal" class="hidden fixed inset-0 z-[75] bg-black/80 backdrop-blur-sm flex items-center justify-center safe-pad">
        <div class="pop-in w-full max-w-sm bg-emerald-950 border-2 border-amber-400 rounded-3xl p-5 text-center shadow-2xl">
            <div id="msgIcon" class="text-5xl mb-2"></div>
            <h3 id="msgTitle" class="text-xl font-serif-asian font-extrabold text-amber-300"></h3>
            <p id="msgText" class="text-sm text-emerald-100/90 mt-2 leading-relaxed"></p>
            <div id="msgButtons" class="flex flex-col gap-2 mt-4"></div>
        </div>
    </div>

    <!-- ==========================================
         THE LAUNCH PAGE (GameHub's .hub-launch: Play and Levels in the usual spots;
         Hub top left and the gear top right come from the frame)
         ========================================== -->
    <main id="launch" class="hub-launch launch">
        <div id="titleTiles" class="flex items-end justify-center gap-3 mt-2"></div>
        <header class="hub-launch-head">
            <h1 class="font-serif-asian font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200">Momahjong</h1>
            <p class="text-amber-300/90 tracking-[0.3em] text-xs font-bold">JADE SANCTUARY MAHJONG</p>
        </header>
        <p id="launchWhere" class="launch-where"></p>
        <div class="hub-launch-actions">
            <button type="button" class="hub-play" onclick="launchPlay()">Play</button>
            <button type="button" id="launchLevels" class="hub-levels" onclick="openMap()" hidden>Levels</button>
        </div>
    </main>

    <!-- Night: warm glass over everything (no blue light), like a phone's night shift. -->
    <div id="nightGlass" aria-hidden="true"></div>

    <!-- The game, in order: each file is one numbered section; they share one global scope. -->
    <script src="js/sound.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/tiles.js"></script>
    <script src="js/random.js"></script>
    <script src="js/formations.js"></script>
    <script src="js/level-seeds.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/state.js"></script>
    <script src="js/board.js"></script>
    <script src="js/play.js"></script>
    <script src="js/powerups.js"></script>
    <script src="js/complete.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/map.js"></script>
    <script src="js/minigames.js"></script>
    <script src="js/debug.js"></script>
    <script src="js/boot.js"></script>
    <!-- GameHub's toolbox, then the game starts (js/hub.js calls startGame). -->
    <script type="module" src="js/hub.js"></script>
</body>
</html>
